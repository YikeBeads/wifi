<head>
<meta charset="utf-8">

<title>Wi-Fi</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:22px;background:#f7f1ef;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(420px,100%);padding:14px;background:#fff;border-radius:24px;box-shadow:0 12px 35px rgba(80,50,50,.12)}
img{width:92%;margin:0 auto;display:block;border-radius:17px}
.info{margin-top:14px;background:#fff8f6;border-radius:17px;padding:7px 12px}
.row{min-height:58px;display:flex;align-items:center;gap:11px}
.row+.row{border-top:1px solid #f0e4e1}
.icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:#ffe0e5;font-size:17px}
.text{min-width:0;flex:1}
.label{font-size:11px;color:#a38f8c;margin-bottom:2px}
.value{font-size:15px;font-weight:650;color:#403535;word-break:break-all}
.copy{border:0;padding:8px 12px;border-radius:10px;background:#ff91a4;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.rules{margin-top:14px;padding:14px 15px;border-radius:17px;background:#fff4df;color:#5b4842;font-size:14px;font-weight:650;line-height:1.8}
.rule+.rule{margin-top:4px}
</style>
